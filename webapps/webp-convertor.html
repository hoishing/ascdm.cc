<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JPG/PNG 轉 WebP 批次轉換器 - Nordic Dark</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap");

      :root {
        --nord0: #2e3440;
        --nord1: #3b4252;
        --nord2: #434c5e;
        --nord3: #4c566a;
        --nord4: #d8dee9;
        --nord5: #e5e9f0;
        --nord6: #eceff4;
        --nord7: #8fbcbb;
        --nord8: #88c0d0;
        --nord9: #81a1c1;
        --nord10: #5e81ac;
        --nord11: #bf616a;
        --nord14: #a3be8c;
      }

      body {
        font-family: "Noto Sans TC", sans-serif;
        background-color: #1a1e25; /* Even darker background for contrast */
        color: var(--nord4);
      }

      .nordic-card {
        background-color: var(--nord0);
        border: 1px solid var(--nord2);
      }

      .nordic-sidebar {
        background-color: #242933;
        border-right: 1px solid var(--nord1);
      }

      .drag-active {
        border-color: var(--nord8) !important;
        background-color: var(--nord1) !important;
      }

      /* Custom Scrollbar - Nordic Dark */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--nord0);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--nord3);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--nord8);
      }

      /* Range Slider Styling */
      input[type="range"]::-webkit-slider-runnable-track {
        background: var(--nord3);
        height: 6px;
        border-radius: 3px;
      }
      input[type="range"]::-webkit-slider-thumb {
        background: var(--nord8);
        margin-top: -5px;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center py-10 px-4">
    <div
      class="nordic-card w-full max-w-4xl rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row border border-slate-800"
    >
      <!-- 左側：控制面板 (Deep Nordic Dark) -->
      <div class="w-full md:w-1/3 nordic-sidebar p-8 flex flex-col justify-between">
        <div>
          <div class="flex items-center gap-3 mb-10">
            <div class="bg-cyan-500/10 p-2.5 rounded-xl border border-cyan-500/20">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-[#88c0d0]"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-[#eceff4]">WebP Studio</h1>
          </div>

          <!-- 設定區域 -->
          <div class="space-y-8">
            <div>
              <div class="flex justify-between items-end mb-3">
                <label class="text-[11px] font-bold text-[#81a1c1] uppercase tracking-widest"> 壓縮品質 </label>
                <span id="qualityValue" class="text-sm font-mono text-[#a3be8c]">85%</span>
              </div>
              <input
                type="range"
                id="quality"
                min="10"
                max="100"
                value="85"
                class="w-full h-1.5 bg-[#4c566a] rounded-lg appearance-none cursor-pointer accent-[#88c0d0]"
              />
            </div>

            <div>
              <label class="block text-[11px] font-bold text-[#81a1c1] uppercase tracking-widest mb-3">
                最大寬度輸出
              </label>
              <div class="relative">
                <input
                  type="number"
                  id="maxWidth"
                  placeholder="1000"
                  value="1000"
                  class="w-full bg-[#2e3440] border border-[#434c5e] rounded-xl py-2.5 px-4 text-sm text-[#eceff4] focus:outline-none focus:border-[#88c0d0] focus:ring-1 focus:ring-[#88c0d0] transition-all"
                />
                <span class="absolute right-4 top-2.5 text-[#4c566a] text-xs">PX</span>
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-[#81a1c1] uppercase tracking-widest mb-3">
                儲存偏好
              </label>
              <div class="space-y-3">
                <label
                  class="flex items-center gap-3 cursor-pointer group p-2 rounded-lg hover:bg-[#2e3440] transition-all"
                >
                  <input
                    type="radio"
                    name="downloadMode"
                    value="zip"
                    checked
                    class="w-4 h-4 text-[#88c0d0] bg-[#2e3440] border-[#4c566a] focus:ring-offset-[#242933]"
                  />
                  <span class="text-sm text-[#d8dee9] group-hover:text-white">打包 ZIP 下載</span>
                </label>
                <label
                  class="flex items-center gap-3 cursor-pointer group p-2 rounded-lg hover:bg-[#2e3440] transition-all"
                >
                  <input
                    type="radio"
                    name="downloadMode"
                    value="individual"
                    class="w-4 h-4 text-[#88c0d0] bg-[#2e3440] border-[#4c566a] focus:ring-offset-[#242933]"
                  />
                  <span class="text-sm text-[#d8dee9] group-hover:text-white">個別檔案下載</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-10">
          <button
            id="convertBtn"
            disabled
            class="w-full bg-[#5e81ac] hover:bg-[#81a1c1] text-white text-sm font-bold py-4 px-4 rounded-xl shadow-lg transition-all transform active:scale-95 disabled:opacity-20 disabled:grayscale flex items-center justify-center gap-3"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>開始轉換處理</span>
          </button>
          <p class="text-center text-[10px] text-[#4c566a] mt-4 uppercase tracking-tighter">
            100% Client-Side Encryption
          </p>
        </div>
      </div>

      <!-- 右側：主工作區 -->
      <div class="w-full md:w-2/3 p-8 bg-[#2e3440] flex flex-col h-[650px]">
        <!-- 上傳區塊 -->
        <div
          id="dropZone"
          class="border-2 border-dashed border-[#434c5e] rounded-2xl p-10 flex flex-col items-center justify-center text-center cursor-pointer transition-all hover:border-[#88c0d0] hover:bg-[#3b4252] mb-8 group relative overflow-hidden"
        >
          <input type="file" id="fileInput" multiple accept="image/png, image/jpeg, image/jpg" class="hidden" />
          <div
            class="bg-[#3b4252] p-5 rounded-2xl mb-4 group-hover:scale-110 transition-transform duration-500 border border-[#4c566a]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-8 w-8 text-[#88c0d0]"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </div>
          <h3 class="text-lg font-medium text-[#eceff4]">匯入您的視覺資產</h3>
          <p class="text-sm text-[#4c566a] mt-2">支援 JPG、PNG 格式拖放</p>
        </div>

        <!-- 檔案列表標題 -->
        <div class="flex justify-between items-center mb-5 border-b border-[#3b4252] pb-4">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-[#a3be8c] rounded-full animate-pulse"></span>
            <h3 class="text-xs font-bold text-[#81a1c1] uppercase tracking-[0.2em]">
              佇列中 (<span id="fileCount">0</span>)
            </h3>
          </div>
          <button
            id="clearBtn"
            class="text-[10px] text-[#bf616a] hover:bg-[#bf616a]/10 px-3 py-1 rounded-full font-bold uppercase transition-all hidden"
          >
            重置所有
          </button>
        </div>

        <!-- 檔案列表容器 -->
        <div id="fileList" class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
          <!-- Empty State -->
          <div id="emptyState" class="h-full flex flex-col items-center justify-center text-[#4c566a] opacity-50">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-12 w-12 mb-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            <p class="text-sm tracking-widest uppercase">等待媒體輸入</p>
          </div>
        </div>

        <!-- 進度條 -->
        <div
          id="progressContainer"
          class="hidden mt-8 p-5 bg-[#3b4252] rounded-2xl border border-[#434c5e] shadow-inner"
        >
          <div class="flex justify-between text-[11px] mb-3 text-[#d8dee9] font-bold uppercase tracking-widest">
            <span id="progressText">Processing Engine Active</span>
            <span id="progressPercent" class="text-[#88c0d0]">0%</span>
          </div>
          <div class="w-full bg-[#2e3440] rounded-full h-2 overflow-hidden">
            <div
              id="progressBar"
              class="bg-gradient-to-r from-[#88c0d0] to-[#8fbcbb] h-full transition-all duration-300 shadow-[0_0_10px_rgba(136,192,208,0.5)]"
              style="width: 0%"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const fileList = document.getElementById("fileList");
      const fileCount = document.getElementById("fileCount");
      const emptyState = document.getElementById("emptyState");
      const qualityInput = document.getElementById("quality");
      const qualityValue = document.getElementById("qualityValue");
      const maxWidthInput = document.getElementById("maxWidth");
      const convertBtn = document.getElementById("convertBtn");
      const clearBtn = document.getElementById("clearBtn");
      const progressContainer = document.getElementById("progressContainer");
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      const progressPercent = document.getElementById("progressPercent");

      let filesToProcess = [];

      qualityInput.addEventListener("input", (e) => {
        qualityValue.textContent = e.target.value + "%";
      });

      ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
        dropZone.addEventListener(
          eventName,
          (e) => {
            e.preventDefault();
            e.stopPropagation();
          },
          false,
        );
      });

      ["dragenter", "dragover"].forEach((eventName) => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add("drag-active"), false);
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropZone.addEventListener(eventName, () => dropZone.classList.remove("drag-active"), false);
      });

      dropZone.addEventListener("drop", (e) => handleNewFiles(e.dataTransfer.files), false);
      dropZone.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", function () {
        handleNewFiles(this.files);
        this.value = "";
      });

      function handleNewFiles(files) {
        const validTypes = ["image/jpeg", "image/png", "image/jpg"];
        const newFiles = Array.from(files).filter((file) => validTypes.includes(file.type));
        if (newFiles.length === 0) return;

        newFiles.forEach((file) => {
          const exists = filesToProcess.some((f) => f.name === file.name && f.size === file.size);
          if (!exists) filesToProcess.push(file);
        });
        updateUI();
      }

      function updateUI() {
        fileCount.textContent = filesToProcess.length;
        if (filesToProcess.length > 0) {
          emptyState.classList.add("hidden");
          clearBtn.classList.remove("hidden");
          convertBtn.disabled = false;
        } else {
          emptyState.classList.remove("hidden");
          clearBtn.classList.add("hidden");
          convertBtn.disabled = true;
          fileList.innerHTML = "";
          fileList.appendChild(emptyState);
          return;
        }

        fileList.innerHTML = "";
        filesToProcess.forEach((file, index) => {
          const li = document.createElement("div");
          li.className =
            "flex items-center justify-between bg-[#3b4252] p-4 rounded-xl border border-[#434c5e] shadow-lg hover:border-[#4c566a] transition-all group";
          const size = (file.size / 1024).toFixed(1) + " KB";

          li.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <div class="bg-[#2e3440] p-2.5 rounded-lg text-[#88c0d0] border border-[#434c5e]">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="text-xs font-bold text-[#eceff4] truncate" title="${file.name}">${file.name}</span>
                            <span class="text-[10px] text-[#81a1c1] font-mono mt-1 uppercase tracking-tighter">${size}</span>
                        </div>
                    </div>
                    <button onclick="removeFile(${index})" class="text-[#4c566a] hover:text-[#bf616a] transition-colors p-2 bg-[#2e3440] rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                `;
          fileList.appendChild(li);
        });
      }

      window.removeFile = function (index) {
        filesToProcess.splice(index, 1);
        updateUI();
      };

      clearBtn.addEventListener("click", () => {
        filesToProcess = [];
        updateUI();
        resetProgress();
      });

      function resetProgress() {
        progressContainer.classList.add("hidden");
        progressBar.style.width = "0%";
        convertBtn.disabled = false;
        convertBtn.innerHTML = `<span>開始轉換處理</span>`;
      }

      convertBtn.addEventListener("click", async () => {
        if (filesToProcess.length === 0) return;
        const quality = parseInt(qualityInput.value) / 100;
        const maxWidth = parseInt(maxWidthInput.value) || 1000;
        const downloadMode = document.querySelector('input[name="downloadMode"]:checked').value;

        convertBtn.disabled = true;
        convertBtn.innerHTML = `RUNNING...`;
        progressContainer.classList.remove("hidden");

        const zip = new JSZip();
        const total = filesToProcess.length;
        let processed = 0;

        try {
          for (let i = 0; i < total; i++) {
            const file = filesToProcess[i];
            progressText.textContent = `OPTIMIZING: ${file.name.substring(0, 10)}...`;

            const blob = await convertToWebP(file, maxWidth, quality);
            const newName = file.name.replace(/\.(png|jpe?g)$/i, "") + ".webp";

            if (downloadMode === "zip") {
              zip.file(newName, blob);
            } else {
              const link = document.createElement("a");
              link.href = URL.createObjectURL(blob);
              link.download = newName;
              link.click();
              await new Promise((r) => setTimeout(r, 200));
            }

            processed++;
            const percent = Math.round((processed / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressPercent.textContent = `${percent}%`;
          }

          if (downloadMode === "zip") {
            progressText.textContent = "COMPILING ZIP ARCHIVE...";
            const zipContent = await zip.generateAsync({ type: "blob" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(zipContent);

            // Format current date as yyyy-mm-dd
            const now = new Date();
            const dateStr = now.toISOString().split("T")[0];
            link.download = `webp_${dateStr}.zip`;

            link.click();
          }

          setTimeout(() => {
            progressText.textContent = "PROCESS COMPLETE";
            convertBtn.disabled = false;
            convertBtn.innerHTML = `<span>轉換成功</span>`;
          }, 500);
        } catch (err) {
          alert("ERROR: " + err.message);
          resetProgress();
        }
      });

      function convertToWebP(file, maxWidth, quality) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => {
            let w = img.width,
              h = img.height;
            if (w > maxWidth) {
              h = Math.round(h * (maxWidth / w));
              w = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, 0, 0, w, h);
            canvas.toBlob(
              (blob) => {
                URL.revokeObjectURL(url);
                blob ? resolve(blob) : reject(new Error("Canvas Failed"));
              },
              "image/webp",
              quality,
            );
          };
          img.onerror = () => reject(new Error("Load Failed"));
          img.src = url;
        });
      }
    </script>
  </body>
</html>
